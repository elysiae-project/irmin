[package]
name = "irmin"
version = "1.0.0"
description = "Native Sophon game downloader for Electron"
authors = ["Chakorn Kungsanarux <chakornk2007@gmail.com>"]
edition = "2024"
rust-version = "1.92.0"

[lib]
name = "irmin"
crate-type = ["cdylib"]

[build-dependencies]
napi-build = "1"

[dependencies]
napi = { version = "3", features = [
    "napi6",
    "tokio_rt",
    "tokio_sync",
    "tokio_time",
    "tokio_macros",
    "tokio_net",
    "tokio_io_util",
    "serde-json",
] }
napi-derive = "3"

tokio = { version = "1", features = ["rt", "sync", "time", "macros", "net", "io-util"] }
futures = "0.3"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", features = ["stream", "blocking", "json"] }
zstd = "0.13"
md5 = "0.8"
prost = "0.14"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
panic = "abort"
