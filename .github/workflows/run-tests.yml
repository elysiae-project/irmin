name: Run Irmin Tests

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

jobs:
    test:
        strategy:
            fail-fast: false
            matrix:
                include:
                    - runner: ubuntu-24.04
                      arch: x86_64
                    - runner: ubuntu-24.04-arm
                      arch: aarch64
        runs-on: ${{ matrix.runner }}
        container:
            image: archlinux:latest
        steps:
            - name: Clone repository
              uses: actions/checkout@v6

            - name: Install dependencies
              run: pacman -Syu base-devel rustup --noconfirm
            
            - name: Run Tests
              run: |
                cargo test
